
name: Build TRACE APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name settings.gradle | head -n 1)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add AndroidX dependency
        working-directory: extracted
        run: |
          BUILD=$(find . -path '*/app/build.gradle' | head -n 1)
          test -n "$BUILD"
          printf "\ndependencies { implementation 'androidx.core:core:1.15.0' }\n" >> "$BUILD"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TRACE-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
